<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Equavela</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
        cursor: default;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font: 11px/1.4 "Noto Sans", system-ui, sans-serif;
        color: #465f76;
      }
      img {
        width: 440px;
        height: auto;
      }
      .progress {
        position: relative;
        width: 300px;
        height: 3px;
        margin-top: 22px;
        overflow: hidden;
        border-radius: 2px;
        background: #e3eef5;
      }
      .progress::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 35%;
        border-radius: 2px;
        background: linear-gradient(90deg, #00428d, #01b5af);
        animation: sail 1.4s ease-in-out infinite;
      }
      @keyframes sail {
        from { transform: translateX(-100%); }
        to { transform: translateX(290%); }
      }
      .version {
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <img src="/src/assets/brand/equavela-logo.svg" alt="Equavela, Scientific Computing Workspace" />
    <div class="progress" aria-hidden="true"></div>
    <div class="version">Version <span id="version"></span></div>
    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
